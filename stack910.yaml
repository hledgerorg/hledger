# stack build plan using GHC 9.10.3
# https://gitlab.haskell.org/ghc/ghc/-/wikis/migration/9.10
# https://downloads.haskell.org/ghc/9.10.1/docs/users_guide/9.10.1-notes.html

resolver: lts-24.57

packages:
- hledger-lib
- hledger
- hledger-ui
- hledger-web

extra-deps:
# megaparsec 9.8.3 parses about 10% faster than earlier versions (megaparsec#612)
- megaparsec-9.8.3
- yesod-core-1.7.0.0
# #2410 haskeline 0.8.4.0+ is needed for correct ANSI display on Windows.
- haskeline-0.8.4.1
# https://haskell.github.io/security-advisories/advisory/HSEC-2026-0007.html
- aeson-2.3.2.0
- text-iso8601-0.2.0.0
# for hledger's openBrowserOn (Windows launch through the Win32 API)
- open-browser-0.5.1.0
allow-newer: true

nix:
  pure: false
  packages: [perl gmp ncurses zlib]
